name: Security Audit

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
    - cron: '0 8 * * 1'

jobs:
  audit-backend:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Audit for high/critical CVEs
        run: npm audit --audit-level=high

  audit-frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # react-scripts bundles webpack/babel with known unfixed high-severity issues
      # in the build toolchain (not in the production output). Audit at critical only.
      - name: Audit for critical CVEs
        run: npm audit --audit-level=critical

  typecheck-backend:
    name: Backend TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Use the locally installed tsc (version pinned in package.json), not npx latest
      - run: ./node_modules/.bin/tsc --noEmit

  typecheck-frontend:
    name: Frontend TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: ./node_modules/.bin/tsc --noEmit
